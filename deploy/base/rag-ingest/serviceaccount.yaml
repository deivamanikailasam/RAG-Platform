# The ingestion worker's OWN identity (Step 37). Until now it shared rag-api's (Step 31): a bug or
# a compromise in either could use the other's secrets. Now OpenBao gives each only what it needs:
# the worker can read the originals and write the index; rag-api can't read the originals at all.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rag-ingest
automountServiceAccountToken: false
