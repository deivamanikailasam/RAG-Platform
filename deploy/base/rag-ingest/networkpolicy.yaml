# The worker and the lifecycle jobs (Step 37): nothing comes in; out only to what they use.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: rag-ingest
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: rag-ingest }
  policyTypes: [Ingress, Egress]
  ingress: []  # no Service, no callers: it pulls work from the queue
  egress:
    - ports: [{ port: 53, protocol: UDP }, { port: 53, protocol: TCP }]  # DNS
    # Postgres, LiteLLM (embeddings), OpenBao, OpenTelemetry, Valkey (queue), object storage (originals)
    - ports: [{ port: 5432 }, { port: 4000 }, { port: 8200 }, { port: 4317 }, { port: 6379 }, { port: 443 }, { port: 9000 }]
