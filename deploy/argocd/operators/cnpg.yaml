# CloudNativePG and its Barman Cloud plugin (Step 37): before any database (wave -1). Needs
# cert-manager in the cluster. prune: false: an operator upgrade must never delete its CRDs (and
# with them every database). No deletion finalizer, for the same reason.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cnpg
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: platform
  source:
    repoURL: git@github.com:owner/rag-platform.git
    targetRevision: main
    path: deploy/cnpg/install
  destination:
    server: https://kubernetes.default.svc
    namespace: cnpg-system
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - PruneLast=true
    retry:
      limit: 5
      backoff: { duration: 10s, factor: 2, maxDuration: 3m }
