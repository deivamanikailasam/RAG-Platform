apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cm
data:
  # Compare every 3 minutes, and right away on a webhook from GitHub (if you set one up)
  timeout.reconciliation: 180s
  # No shell into pods from the Argo CD web UI: use kubectl, with its own audit trail
  exec.enabled: "false"
  # Kustomize may not read files outside each app's folder (the default; stated on purpose)
  kustomize.buildOptions: --load-restrictor LoadRestrictionsRootOnly
  # Let an Application's health count in sync waves (app of apps): wait for "cluster" to be
  # Healthy before syncing "rag-api-local". The snippet is the one from Argo CD's documentation.
  resource.customizations.health.argoproj.io_Application: |
    hs = {}
    hs.status = "Progressing"
    hs.message = ""
    if obj.status ~= nil then
      if obj.status.health ~= nil then
        hs.status = obj.status.health.status
        if obj.status.health.message ~= nil then
          hs.message = obj.status.health.message
        end
      end
    end
    return hs
