apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"  # Argo CD manages its own upgrades
  # No deletion finalizer on purpose: deleting this Application must NOT delete what it manages.
spec:
  project: platform
  source:
    repoURL: git@github.com:owner/rag-platform.git
    targetRevision: main
    path: deploy/argocd/install
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true  # removed from git = removed from the cluster
      selfHeal: true  # changed by hand in the cluster = changed back to what git says
    syncOptions:
      - ServerSideApply=true
      - PruneLast=true
    retry:
      limit: 5
      backoff: { duration: 10s, factor: 2, maxDuration: 3m }
