# Argo Rollouts (Step 37): canary releases with automatic analysis. The upstream release manifest,
# vendored and checked by SHA-256 (`just vendor argo-rollouts v1.10.1`), like Argo CD (Step 29).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: argo-rollouts
resources:
  - namespace.yaml
  - upstream/install.yaml  # v1.10.1, sha256 149148429a6f8258b789003ffb9bc6698a526d611ecb1b185624217cf51bae7f
images:
  - name: quay.io/argoproj/argo-rollouts
    digest: sha256:<digest>  # of :v1.10.1 (Step 9 method)
