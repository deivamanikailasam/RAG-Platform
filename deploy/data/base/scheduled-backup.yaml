# A base backup every night at 01:30 UTC (six fields: seconds first). WAL is archived continuously.
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: rag-db-nightly
spec:
  schedule: "0 30 1 * * *"
  backupOwnerReference: self
  cluster: { name: rag-db }
  method: plugin
  pluginConfiguration: { name: barman-cloud.cloudnative-pg.io }
