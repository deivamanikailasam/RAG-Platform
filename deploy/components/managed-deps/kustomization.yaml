# Staging and prod (Step 37): the platform's shared services are real, separately run services
# (a CloudNativePG cluster, the platform team's gateway, OPA, OpenBao, your identity provider, the
# telemetry pipeline). These Services keep the SAME names rag-api uses everywhere (rag-db, litellm,
# …), so its settings don't change between environments: only where each name points does.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - services.yaml
