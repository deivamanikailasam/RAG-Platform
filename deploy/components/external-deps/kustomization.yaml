# The platform's stateful and shared services stay in Docker Compose on your Mac (Step 29):
# databases, Keycloak, LiteLLM, OPA, OpenBao, the telemetry pipeline. These Services give them the
# same names inside the cluster as in Compose, so rag-api's settings don't change.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - services.yaml
