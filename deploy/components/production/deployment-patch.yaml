# The Deployment stays the single description of the pod (and what the admission policies check),
# but the Rollout runs the pods: replicas 0 here, the Rollout scales up from this template.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rag-api
spec:
  replicas: 0
  template:
    spec:
      topologySpreadConstraints:
        # at most one more pod in any zone than in the others: losing a zone loses a third
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector: { matchLabels: { app.kubernetes.io/name: rag-api } }
          matchLabelKeys: [rollouts-pod-template-hash]  # spread each release's pods on their own
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector: { matchLabels: { app.kubernetes.io/name: rag-api } }
      containers:
        - name: rag-api
          env:
            - { name: RAG_API_RAG_PROFILE, value: production }  # `rag config readiness` checks it
            - { name: RAG_ENVIRONMENT, value: set-by-overlay }
            # The pod-template hash Argo Rollouts gives each release: canary and stable differ
            - name: RAG_API_RELEASE
              valueFrom: { fieldRef: { fieldPath: "metadata.labels['rollouts-pod-template-hash']" } }
            - name: OTEL_RESOURCE_ATTRIBUTES  # Prometheus keeps these as labels (Step 20)
              value: "service.version=$(RAG_API_RELEASE),deployment.environment.name=$(RAG_ENVIRONMENT)"
          resources:
            requests: { cpu: 500m, memory: 512Mi }
            limits: { memory: 1Gi }
