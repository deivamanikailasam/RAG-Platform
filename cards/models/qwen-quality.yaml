kind: model
id: qwen-quality
title: Qwen3.8-27B, 8-bit MLX (qwen-quality)
status: approved
owner: rag-platform
task: generation
summary: >-
  The careful, slower chat model: answers grounded in retrieved documents, synthesis across
  several sources, and drafting evaluation judgements. Served locally by mlx-lm (Step 7).
licence:
  id: apache-2.0
  url: https://huggingface.co/Qwen/Qwen3.8-27B
  verified_on: 2026-10-11          # the date YOU read the licence on the upstream page
intended_use:
  - Answering employee questions from retrieved company documents (Step 33), with citations
  - Summarising and comparing several documents the user is allowed to read
  - Drafting judgements for offline evaluation, reviewed by people (Step 26)
out_of_scope:
  - Decisions about people (hiring, performance, pay, discipline) without a human deciding
  - Legal, medical or financial advice presented as authoritative
  - Answering without retrieved sources, from "its own knowledge", on company matters
risks:
  - Hallucination (fluent, confident statements the documents don't support)
  - Prompt injection through retrieved documents (mitigated by Step 24's prompt rules and Step 18's policy)
  - 8-bit quantisation can lose a little accuracy versus the full-precision model
training_data: >-
  Large-scale multilingual web, code and curated data, as described by the publisher. The exact
  datasets are not disclosed in detail; treat its world knowledge as unverified and possibly dated.
data_handling: >-
  Runs on the Mac through the gateway (Step 9). Prompts, documents and answers never leave the
  machine; the gateway logs metadata only (Step 10).
fallback_allowed: true             # the gateway may send it to qwen-fast if this server is down
known_limitations:
  - Slow (tens of tokens per second); long answers take minutes
  - Knowledge cut-off and training data unknown in detail
  - Quality in languages other than English not yet measured on our documents
last_reviewed: 2026-10-12
review_every_days: 180
approvals:
  - {by: you, date: 2026-10-11, note: "Step 7: selected after the benchmark in docs/benchmarks"}
