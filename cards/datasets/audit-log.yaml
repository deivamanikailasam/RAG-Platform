kind: dataset
id: audit-log
title: Audit log (who received what)
status: approved
owner: security
role: operational
summary: >-
  The hash-chained, append-only record of searches, refusals and admin actions (Step 23), and its
  anchored copies in write-once storage.
inputs:
  - system:rag-api
locations:
  - Postgres database audit, table audit.events (Step 23)
  - s3://rag-audit-archive/audit/ (segments and manifests, object lock)
provenance: Written by rag-api through audit.append(); anchored hourly by audit_chain.py.
classification_max: internal
personal_data: true
personal_data_notes: >-
  Pseudonymous user ids (sub) with actions, times and document ids. No names, questions or
  document text. Pseudonymous data is still personal data.
legal_basis: Legal obligation and legitimate interest in securing access to company information.
retention: Years, per the compliance owner (object-lock retention, Step 14/23).
deletion: >-
  Rows are never deleted; erasure is by deleting the person's identity in Keycloak, which leaves
  the ids unlinkable (crypto-shredding by lookup, Step 23).
access: audit_reader role and the audit-reader identity; security and auditors only.
known_limitations:
  - Records only what rag-api reports; up to one hour of events is not yet anchored
last_reviewed: 2026-10-12
review_every_days: 180
approvals:
  - {by: you, date: 2026-10-12}
