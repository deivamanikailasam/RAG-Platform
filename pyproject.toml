[project]
name = "rag-platform"
version = "0.1.0"
description = "Workspace root for the RAG platform"
requires-python = ">=3.12,<3.13"   # pinned to 3.12, see ADR-0003
dependencies = []

[dependency-groups]
dev = [
    "boto3>=1.43.0",               # AWS SDK: type-checks and tests the s3_*.py scripts against the object store (Step 14)
    "boto3-stubs[s3]>=1.43.0",     # type hints for boto3 S3 clients, so strict mypy can check those scripts (Step 14)
    "mypy>=2.4.0",
    "openai>=3.29.0",              # OpenAI SDK: type-checks and tests the gateway smoke test (Step 9)
    "opensearch-py>=3.2.0",        # OpenSearch client: type-checks and tests the os_*.py scripts (Step 13)
    "pgvector>=0.4.0",             # pgvector types for psycopg: type-checks and tests pg_demo.py (Step 11)
    "pre-commit>=4.6.2",
    "psycopg[binary]>=3.2.0",      # Postgres driver: type-checks and tests pg_demo.py (Step 11)
    "pyjwt>=2.15.1",               # signs scoped Qdrant tokens: type-checks and tests qdrant_token.py (Step 12)
    "pytest>=9.1.1",
    "pyyaml>=6.0.3",               # tests read the Compose and gateway config files (Step 9)
    "qdrant-client>=1.19.1",       # Qdrant client: type-checks and tests the qdrant_*.py scripts (Step 12)
    "redis>=8.1.0",                # Redis-protocol client: type-checks and tests kv_queue_demo.py against Valkey (Step 15)
    "ruff>=0.17.0",
    "types-pyyaml>=6.0.12.20260906",  # type hints for pyyaml, so strict mypy can check those tests
]                                  # shared dev tools (Step 5), locked in uv.lock

[tool.uv]
package = false                    # the root is a container for members, not a package itself

[tool.uv.workspace]
members = ["libs/*"]               # add "services/*" when the first service exists (Step 9)
exclude = ["infra/model-serving"]  # Apple-only MLX serving project with its own lockfile (Step 7)

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle: basic style errors and warnings
    "F",        # pyflakes: unused imports/variables, undefined names
    "I",        # isort: import ordering
    "B",        # flake8-bugbear: likely bugs (mutable defaults, etc.)
    "UP",       # pyupgrade: use modern Python syntax
    "SIM",      # flake8-simplify: simpler equivalent code
    "N",        # pep8-naming: naming conventions
    "S",        # flake8-bandit: security issues (eval, hardcoded passwords, etc.)
    "C4",       # flake8-comprehensions: cleaner list/dict comprehensions
    "PT",       # flake8-pytest-style: consistent tests
    "T20",      # flake8-print: no stray print() in library code (use logging)
    "RUF",      # ruff's own rules
]
ignore = ["E501"]                   # line length is the formatter's job

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101"]            # assert is normal in tests
"scripts/**"  = ["T20"]             # scripts may print

[tool.ruff.lint.isort]
known-first-party = ["rag_common"]

[tool.ruff.format]
quote-style = "double"
docstring-code-format = true

[tool.mypy]
python_version = "3.12"
strict = true                       # the full set of strictness checks
warn_unreachable = true
pretty = true
files = ["libs/rag-common/src", "scripts", "tests"]  # add each new library/service as it's created
plugins = ["pydantic.mypy"]          # so mypy understands pydantic models (Step 6)

[tool.pytest.ini_options]
testpaths = ["libs", "tests"]
addopts = "-ra --strict-markers --import-mode=importlib"
