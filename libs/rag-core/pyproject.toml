[project]
name = "rag-core"
version = "0.1.0"
description = "The reusable RAG core (Steps 30-35): contracts, switchable components, pipelines"
requires-python = ">=3.12,<3.13"
dependencies = [
    "rag-common",
    "pydantic>=2.10",
    "pyyaml>=6.0",
    "httpx>=0.28",
]

[project.optional-dependencies]
# Each extra pulls in what ONE family of components needs, so a project installs only what it uses
pdf = [
    "pypdf>=6.0",
]
docx = [
    "python-docx>=1.2",
]
postgres = ["psycopg[binary]>=3.2", "pgvector>=0.4"]
valkey = [
    "redis>=6.0",
]
# The exact token counter (`token_counter: hf-tokenizer`) reads the model's tokenizer.json with it
tokenizers = [
    "tokenizers>=0.21",
]

[tool.uv.sources]
rag-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
rag = "rag_core.cli:main"
