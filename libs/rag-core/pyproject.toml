[project]
name = "rag-core"
version = "1.0.0"
description = "The reusable RAG core (Steps 30-38): contracts, switchable components, pipelines, SDK, standards"
requires-python = ">=3.12,<3.13"
dependencies = [
    "rag-common",
    "pydantic>=2.10",
    "pyyaml>=6.0",
    "httpx>=0.28",
    "opentelemetry-api>=1.45",   # Step 31: every ingestion stage is a trace span (rag-common sets up the SDK)
]

[project.optional-dependencies]
# Each extra pulls in what ONE family of components needs, so a project installs only what it uses
pdf = [
    "pypdf>=6.0",
]
docx = [
    "python-docx>=1.2",
]
# psycopg-pool: the Postgres components share a small pool whose logins are read per connection (Step 31)
postgres = ["psycopg[binary]>=3.2", "pgvector>=0.4", "psycopg-pool>=3.3"]
valkey = [
    "redis>=6.0",
]
# `load_source("s3://…")`: originals are read from the object store (Step 14) by the ingestion worker
s3 = [
    "boto3>=1.40",
]
# The exact token counter (`token_counter: hf-tokenizer`) reads the model's tokenizer.json with it
tokenizers = [
    "tokenizers>=0.21",
]

[tool.uv.sources]
rag-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
rag = "rag_core.cli:main"
