# On every merge to main: publish the rag-api image, signed, with an SBOM and build provenance.
name: release

on:
  push:
    branches: [main]

permissions: {}  # nothing by default; the job below asks for exactly what it needs

concurrency:  # publish merges one at a time, in order; never cancel a half-finished release
  group: release
  cancel-in-progress: false

jobs:
  publish:
    name: build, sign, attest and push rag-api
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write      # push the image to GitHub Container Registry (ghcr.io)
      id-token: write      # a short-lived identity for keyless signing: no signing key to steal
      attestations: write  # store the SBOM and provenance attestations
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Image name (registries need lower case)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}/rag-api" >> "$GITHUB_ENV"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          version: "0.11.32"
      - name: Install the pinned tools (checksums verified)
        run: |
          uv run --no-project --with pyyaml python scripts/ci_tools.py syft cosign
          echo "$PWD/.tools/bin" >> "$GITHUB_PATH"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: services/rag-api/Dockerfile
          push: true
          tags: ${{ env.IMAGE }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Sign the image by digest (keyless, Sigstore)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
      - name: SBOM of exactly what was pushed
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: syft scan "${IMAGE}@${DIGEST}" -o cyclonedx-json=rag-api.cdx.json
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6  # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: rag-api.cdx.json
          push-to-registry: true
      - name: Summary
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "### rag-api published"
            echo "Image: \`${IMAGE}@${DIGEST}\`"
            echo "Verify: \`just image-verify ${DIGEST}\`"
          } >> "$GITHUB_STEP_SUMMARY"
