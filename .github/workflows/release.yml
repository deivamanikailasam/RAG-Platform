# On every merge to main: publish the rag-api image, signed, with an SBOM and build provenance.
name: release

on:
  push:
    branches: [main]

permissions: {}  # nothing by default; the job below asks for exactly what it needs

concurrency:  # publish merges one at a time, in order; never cancel a half-finished release
  group: release
  cancel-in-progress: false

jobs:
  publish:
    name: build, sign, attest and push rag-api
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write      # push the image to GitHub Container Registry (ghcr.io)
      id-token: write      # a short-lived identity for keyless signing: no signing key to steal
      attestations: write  # store the SBOM and provenance attestations
    outputs:
      digest: ${{ steps.build.outputs.digest }}  # the evidence job below records its checks for this digest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Image name (registries need lower case)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}/rag-api" >> "$GITHUB_ENV"
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          version: "0.11.32"
      - name: Install the pinned tools (checksums verified)
        run: |
          uv run --no-project --with pyyaml python scripts/ci_tools.py syft cosign
          echo "$PWD/.tools/bin" >> "$GITHUB_PATH"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6  # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: services/rag-api/Dockerfile
          push: true
          tags: ${{ env.IMAGE }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Sign the image by digest (keyless, Sigstore)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
      - name: SBOM of exactly what was pushed
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: syft scan "${IMAGE}@${DIGEST}" -o cyclonedx-json=rag-api.cdx.json
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6  # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: rag-api.cdx.json
          push-to-registry: true
      - name: Summary
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "### rag-api published"
            echo "Image: \`${IMAGE}@${DIGEST}\`"
            echo "Verify: \`just image-verify ${DIGEST}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # Step 37: the promotion gates (deploy/envs/promotion.yaml) need evidence for THIS digest, made on
  # the commit it was built from. Read-only: it verifies the published image and runs the offline
  # checks, then keeps release-evidence/ as a build artefact for `just gates` / `just promote`.
  evidence:
    name: record promotion evidence
    needs: [publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read       # cosign reads the signature next to the image in ghcr.io
      attestations: read   # gh attestation verify reads the provenance and SBOM attestations
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          version: "0.11.32"
      - name: Install just and the pinned tools (checksums verified)
        run: |
          uv tool install rust-just==1.58.0
          uv run --no-project --with pyyaml python scripts/ci_tools.py cosign
          echo "$PWD/.tools/bin" >> "$GITHUB_PATH"
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6  # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Run and record the offline promotion checks (image-verify, readiness, search, guard, answer)
        env:
          DIGEST: ${{ needs.publish.outputs.digest }}
          GH_TOKEN: ${{ github.token }}  # gh repo view and gh attestation verify
        run: just gates-evidence "$DIGEST"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: release-evidence
          path: release-evidence/
          if-no-files-found: error
          retention-days: 90
      - name: Summary
        if: always()
        env:
          DIGEST: ${{ needs.publish.outputs.digest }}
        run: |
          {
            echo "### Promotion evidence for \`${DIGEST}\`"
            echo "Download: \`gh run download ${GITHUB_RUN_ID} -n release-evidence -D release-evidence\`"
            echo "Then: \`just gates staging ${DIGEST}\`"
          } >> "$GITHUB_STEP_SUMMARY"
