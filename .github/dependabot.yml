# Weekly pull requests that bump pinned versions (Step 27). Each one runs the full CI.
version: 2
updates:
  - package-ecosystem: github-actions  # rewrites the commit SHAs and their "# vX.Y.Z" comments
    directory: /
    schedule: {interval: weekly}
    groups:
      actions: {patterns: ["*"]}
  - package-ecosystem: uv  # uv.lock
    directory: /
    schedule: {interval: weekly}
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: docker  # base images in the Dockerfile (tags and digests)
    directory: /services/rag-api
    schedule: {interval: weekly}
