# Valkey configuration for the platform's fast store: cache, queues and locks (Step 15).
# Users and passwords are NOT here: they come from an ACL file the container builds in RAM from
# secret files at start-up (see the valkey service in infra/compose/compose.yaml).

# --- network (inside the Compose network; host access only via 127.0.0.1 port mapping) ---
bind 0.0.0.0
port 6379
protected-mode yes

# --- memory: cap it, and evict ONLY keys that have a TTL (cache), never queues/locks ---
maxmemory 512mb
maxmemory-policy volatile-lru

# --- persistence: snapshot + append-only log (lose at most ~1 s of writes on a crash) ---
dir /data
save 900 1 300 10 60 10000
appendonly yes
appendfsync everysec

# --- diagnostics ---
# log commands slower than 10 ms
slowlog-log-slower-than 10000
latency-monitor-threshold 100
