groups:
  - name: security
    rules:
      # The post-check dropped a document the query returned: the SQL filter and the policy disagree.
      # Nothing leaked (the post-check worked), but something is wrong. Always investigate.
      - alert: RagPolicyQueryMismatch
        expr: increase(rag_search_dropped_documents_total[15m]) > 0
        labels: { severity: critical, service: rag-api }
        annotations:
          summary: "Search returned {{ $value | humanize }} document(s) the policy then refused"
          runbook: docs/runbooks/rag-policy-mismatch.md
      # Many failed sign-ins: password guessing, or a broken client. Lockout (Step 16) limits damage.
      - alert: KeycloakLoginFailuresHigh
        expr: sum by (realm) (increase(keycloak_user_events_total{event="login", error!=""}[10m])) > 20
        labels: { severity: warning, service: keycloak }
        annotations:
          summary: "{{ $value | humanize }} failed sign-ins in realm {{ $labels.realm }} in 10 min"
          runbook: docs/runbooks/keycloak-login-failures.md
      # rag-api couldn't store audit events (Step 23). It fails closed, so searches are being REFUSED
      # with 503 right now. Fix the audit database first; the runbook says how.
      - alert: RagAuditWriteFailing
        expr: sum(increase(rag_audit_write_failures_total[5m])) > 0
        labels: { severity: critical, service: rag-api }
        annotations:
          summary: "Audit events cannot be stored: rag-api is refusing requests until they can"
          runbook: docs/runbooks/audit-log.md
