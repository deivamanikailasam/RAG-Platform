# OpenTelemetry Collector: the platform's single entry point for traces, metrics and logs.
# Pipeline per signal:   receivers -> processors (in order) -> exporters

extensions:
  health_check:                                  # GET :13133/ -> 200 when the pipelines are running
    endpoint: 0.0.0.0:13133

receivers:
  otlp:                                          # the standard OpenTelemetry protocol
    protocols:
      grpc: { endpoint: 0.0.0.0:4317 }
      http: { endpoint: 0.0.0.0:4318 }
  fluent_forward:                                # container stdout/stderr, sent by Docker's "fluentd" log driver
    endpoint: 0.0.0.0:24224

processors:
  # 1. FIRST: refuse data instead of crashing when memory runs short.
  memory_limiter:
    check_interval: 1s
    limit_percentage: 80
    spike_limit_percentage: 20

  # 2. Container logs arrive from Docker's log driver, all containers over one connection. Each line
  #    carries its Compose service name (the driver's "labels" option). Regroup lines by that value,
  #    so every group belongs to exactly one service, then name the service after it.
  groupbyattrs/container:
    keys: [com.docker.compose.service]
  transform/container-logs:
    log_statements:
      - context: resource
        conditions: ['attributes["com.docker.compose.service"] != nil']
        statements:
          - set(attributes["service.name"], attributes["com.docker.compose.service"])
          - delete_key(attributes, "com.docker.compose.service")
      - context: log
        statements:
          - delete_key(attributes, "fluent.tag")

  # 3. Remove things that must never be stored, whatever a service sends by mistake.
  attributes/scrub:
    actions:
      - { key: http.request.header.authorization, action: delete }
      - { key: http.request.header.cookie, action: delete }
      - { key: db.query.parameters, action: delete }
      - { key: gen_ai.input.messages, action: delete }     # prompt content (opt-in only, Project 9)
      - { key: gen_ai.output.messages, action: delete }    # answer content
  redaction:
    allow_all_keys: true                         # keep every attribute…
    blocked_values:                              # …but mask any VALUE that looks like a secret
      - "eyJ[A-Za-z0-9_-]+\\.[A-Za-z0-9_-]+\\.[A-Za-z0-9_-]+"   # JWTs
      - "sk-[A-Za-z0-9_-]{16,}"                                  # LiteLLM / OpenAI-style keys
      - "[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Za-z]{2,}"        # email addresses
    summary: info                                # count what was masked, in redaction.* attributes
  # The redaction processor checks ATTRIBUTES. A log line's text is its BODY, so mask that too.
  transform/redact-log-body:
    log_statements:
      - context: log
        statements:
          - replace_pattern(body, "eyJ[A-Za-z0-9_-]+\\.[A-Za-z0-9_-]+\\.[A-Za-z0-9_-]+", "****")
          - replace_pattern(body, "sk-[A-Za-z0-9_-]{16,}", "****")
          - replace_pattern(body, "[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Za-z]{2,}", "****")

  # 4. Label everything with where it came from.
  resource:
    attributes:
      - { key: deployment.environment.name, value: dev, action: upsert }

  # 5. LAST: send in batches (far fewer, larger requests).
  batch:
    timeout: 2s
    send_batch_size: 1024

exporters:
  otlp_grpc/tempo:                               # traces -> Tempo (Step 21)
    endpoint: tempo:4317
    tls: { insecure: true }                      # inside the Compose network only
  otlp_http/prometheus:                          # metrics -> Prometheus's OTLP endpoint (Step 20)
    endpoint: http://prometheus:9090/api/v1/otlp
    tls: { insecure: true }
  otlp_http/loki:                                # logs -> Loki's OTLP endpoint (Step 21)
    endpoint: http://loki:3100/otlp
    tls: { insecure: true }

service:
  extensions: [health_check]
  telemetry:
    logs: { level: info, encoding: json }
    metrics:                                     # the Collector's OWN health (accepted, refused, queue size…)
      level: normal
      readers:
        - pull:
            exporter:
              prometheus: { host: 0.0.0.0, port: 8888 }   # scraped by Prometheus
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, attributes/scrub, redaction, resource, batch]
      exporters: [otlp_grpc/tempo]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [otlp_http/prometheus]
    logs:
      receivers: [otlp, fluent_forward]
      processors: [memory_limiter, groupbyattrs/container, transform/container-logs, attributes/scrub,
                   redaction, transform/redact-log-body, resource, batch]
      exporters: [otlp_http/loki]
