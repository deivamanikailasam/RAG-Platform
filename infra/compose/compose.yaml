# The platform stack. Start with:   just up   (secrets are decrypted in memory by sops)
name: rag-platform

services:
  litellm-db:                                                 # the gateway's own private database (Step 10)
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24   # pin by digest (Step 9 method)
    environment:
      POSTGRES_DB: litellm
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD_FILE: /run/secrets/litellm_db_password   # official image reads the password from a file
    secrets: [litellm_db_password]
    volumes:
      - litellm-db-data:/var/lib/postgresql/data              # named volume (Step 3): fast, survives restarts
    # NO "ports:" section. Only containers on this Compose network can reach it.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm -d litellm"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    deploy:
      resources:
        limits: { memory: 512m, cpus: "1" }

  litellm:
    image: ghcr.io/berriai/litellm:v1.104.0@sha256:625981c83410a3ea68eb0697590a57ec1d764d634514d54fa5db0591077ee839
    # The image only reads keys from environment variables, so a tiny wrapper reads the secret FILES
    # and exports them inside the container process only. They never appear in `docker inspect`.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        export LITELLM_MASTER_KEY="$$(cat /run/secrets/litellm_master_key)"
        TEI_API_KEY="$$(cat /run/secrets/tei_api_key)"
        LITELLM_SALT_KEY="$$(cat /run/secrets/litellm_salt_key)"
        DATABASE_URL="postgresql://litellm:$$(cat /run/secrets/litellm_db_password)@litellm-db:5432/litellm"
        REDIS_URL="redis://litellm:$$(cat /run/secrets/valkey_litellm_password)@valkey:6379/0" &&
        exec litellm --config /app/config.yaml --host 0.0.0.0 --port 4000
    secrets: [litellm_master_key, tei_api_key, litellm_salt_key, litellm_db_password,
              valkey_litellm_password]
    depends_on:
      litellm-db: { condition: service_healthy }             # don't start until the database answers
      valkey:     { condition: service_healthy }             # …and the response cache (Step 15)
    volumes:
      - ../config/litellm/config.yaml:/app/config.yaml:ro     # config is read-only inside the container
    environment:                                              # LiteLLM's OpenTelemetry callback (Step 19)
      OTEL_EXPORTER: otlp_http
      OTEL_ENDPOINT: http://otel-collector:4318
      OTEL_SERVICE_NAME: litellm
    ports:
      - "127.0.0.1:4000:4000"                                 # localhost only (Step 3 rule)
    extra_hosts:
      - "host.docker.internal:host-gateway"                   # reach the native model servers, on any runtime
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    deploy:
      resources:
        limits: { memory: 2g, cpus: "2" }

  rag-db:                                                     # the platform's document + vector store (Step 11)
    image: pgvector/pgvector:0.8.7-pg17@sha256:ac08538c6f8b9904c33c8224c5e5706dbe760aca29db1d096972b4052c22a75d   # Postgres 17 + pgvector 0.8.7, pinned by digest
    environment:
      POSTGRES_DB: rag
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/rag_db_superuser_password
    secrets: [rag_db_superuser_password, rag_db_migrator_password, rag_db_app_password, rag_db_readonly_password]
    volumes:
      - rag-db-data:/var/lib/postgresql/data
      - ../config/rag-db/init:/docker-entrypoint-initdb.d:ro  # one-time bootstrap: roles, extensions, schema
    command:
      - postgres
      - -c
      - shared_buffers=1GB                      # Postgres's own cache (~25% of the container's memory)
      - -c
      - effective_cache_size=3GB                # hint: total memory available for caching
      - -c
      - maintenance_work_mem=1GB                # HNSW builds are much faster when the graph fits here
      - -c
      - work_mem=32MB                           # per sort/hash operation
      - -c
      - max_connections=100
      - -c
      - shared_preload_libraries=pg_stat_statements   # per-query statistics for Step 20
      - -c
      - log_min_duration_statement=500          # log any query slower than 500 ms
      - -c
      - password_encryption=scram-sha-256
    shm_size: 1g                                # parallel index builds need shared memory (Docker's default is 64 MB)
    ports:
      - "127.0.0.1:5432:5432"                   # localhost only: for migrations and admin tools on your Mac
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rag"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    deploy:
      resources:
        limits: { memory: 4g, cpus: "4" }

  qdrant:                                                     # dedicated vector database: a DERIVED index of rag-db (Step 12)
    image: qdrant/qdrant:v1.19.2@sha256:b7b0444c4c351c970b98e90a6f89c2ee4287c65b44e52b4cb503fa5b2aa927ad   # pin by digest (Step 9 method)
    # Keys come from secret FILES and are exported only inside the container process.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        export QDRANT__SERVICE__API_KEY="$$(cat /run/secrets/qdrant_api_key)"
        QDRANT__SERVICE__READ_ONLY_API_KEY="$$(cat /run/secrets/qdrant_read_only_api_key)" &&
        exec /qdrant/entrypoint.sh
    environment:
      QDRANT__TELEMETRY_DISABLED: "true"        # don't send usage reports (same habit as Step 1)
      QDRANT__SERVICE__JWT_RBAC: "true"         # allow scoped tokens signed with the admin key
      QDRANT__LOG_LEVEL: INFO
    secrets: [qdrant_api_key, qdrant_read_only_api_key]
    volumes:
      - qdrant-data:/qdrant/storage
      - qdrant-snapshots:/qdrant/snapshots
    ports:
      - "127.0.0.1:6333:6333"                   # REST API + web dashboard
      - "127.0.0.1:6334:6334"                   # gRPC API
      # 6335 (cluster-internal, unauthenticated) is deliberately NOT published
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    deploy:
      resources:
        limits: { memory: 2g, cpus: "2" }

  opensearch:                                                 # keyword + hybrid search engine: a DERIVED index of rag-db (Step 13)
    image: opensearchproject/opensearch:3.8.0@sha256:fafe3fc3587088674669235575aa166228c48bdb940294a8cdbbc1da75236a40   # pin by digest (Step 9 method)
    # Admin password from a secret FILE, exported only inside the process; then hand over to the
    # image's own entrypoint (adjust the path/args to what `docker image inspect` printed).
    entrypoint: ["/bin/bash", "-c"]
    command:
      - >
        export OPENSEARCH_INITIAL_ADMIN_PASSWORD="$$(cat /run/secrets/opensearch_admin_password)" &&
        exec /usr/share/opensearch/opensearch-docker-entrypoint.sh opensearch
    environment:
      discovery.type: single-node               # one node: no cluster discovery
      bootstrap.memory_lock: "true"             # keep the heap in RAM (no swapping)
      OPENSEARCH_JAVA_OPTS: "-Xms2g -Xmx2g"     # fixed 2 GB heap (half the container limit)
    secrets: [opensearch_admin_password]
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 65536, hard: 65536 }
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    ports:
      - "127.0.0.1:9200:9200"                   # REST API (HTTPS). 9600 (perf analyzer) not published
    healthcheck:
      # "up" = answers HTTPS at all (401 without credentials is fine), so no password in the healthcheck
      test: ["CMD-SHELL", "curl -sk -o /dev/null -w '%{http_code}' https://localhost:9200 | grep -qE '200|401'"]
      interval: 20s
      timeout: 10s
      retries: 15
      start_period: 60s
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    deploy:
      resources:
        limits: { memory: 4g, cpus: "4" }

  object-store:                                               # S3-compatible object storage for ORIGINAL files: the raw zone (Step 14)
    image: chrislusf/seaweedfs:4.45@sha256:fc9f76fa993ad69966ffeb2f65d0318fcae39c6f8e20cf68ef7b3a5cb97769e5   # SeaweedFS 4.x, pin by digest (Step 9 method)
    # SeaweedFS reads its users ("identities") from a JSON file. The container builds that file at
    # start-up from the secret FILES, into a RAM-only folder, then starts the server. Nothing on disk.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        umask 077
        cat > /run/seaweed/s3.json <<EOF
        {"identities": [
          {"name": "admin",
           "credentials": [{"accessKey": "$$(cat /run/secrets/s3_admin_access_key)", "secretKey": "$$(cat /run/secrets/s3_admin_secret_key)"}],
           "actions": ["Admin", "Read", "Write", "List", "Tagging"]},
          {"name": "rag-ingest",
           "credentials": [{"accessKey": "$$(cat /run/secrets/s3_ingest_access_key)", "secretKey": "$$(cat /run/secrets/s3_ingest_secret_key)"}],
           "actions": ["Read:rag-raw-docs", "Write:rag-raw-docs", "List:rag-raw-docs", "Tagging:rag-raw-docs",
                       "Read:rag-tmp", "Write:rag-tmp", "List:rag-tmp"]},
          {"name": "rag-reader",
           "credentials": [{"accessKey": "$$(cat /run/secrets/s3_reader_access_key)", "secretKey": "$$(cat /run/secrets/s3_reader_secret_key)"}],
           "actions": ["Read:rag-raw-docs", "List:rag-raw-docs"]}
        ]}
        EOF
        exec weed mini -dir=/data -s3.config=/run/seaweed/s3.json -master.telemetry=false
    secrets: [s3_admin_access_key, s3_admin_secret_key, s3_ingest_access_key, s3_ingest_secret_key,
              s3_reader_access_key, s3_reader_secret_key]
    tmpfs:
      - /run/seaweed:size=1m,mode=0700          # identities file lives in RAM only
    volumes:
      - object-store-data:/data
    ports:
      - "127.0.0.1:8333:8333"                   # S3 API only. Master/filer/admin UIs stay internal
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8333 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    deploy:
      resources:
        limits: { memory: 1g, cpus: "2" }

  valkey:                                                     # in-memory store: LLM response cache, job queues, locks (Step 15)
    image: valkey/valkey:9.1.2-alpine@sha256:48332870af354a799964c0012ae1194a0bf2bf894eb508f945810596dc2d8d11   # Valkey 9.1.x, pin by digest (Step 9 method)
    # Valkey reads its users from an ACL file. The container builds that file at start-up from the
    # secret FILES, into a RAM-only folder (same pattern as SeaweedFS), then starts the server.
    # The image's own entrypoint then drops from root to the unprivileged "valkey" user.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        umask 077
        cat > /run/valkey/users.acl <<EOF
        user default off
        user admin on >$$(cat /run/secrets/valkey_admin_password) ~* &* +@all
        user litellm on >$$(cat /run/secrets/valkey_litellm_password) ~* &* +@all -@dangerous
        user rag_app on >$$(cat /run/secrets/valkey_app_password) ~rag:* &rag:* +@all -@dangerous -@admin
        EOF
        chown -R valkey:valkey /run/valkey
        exec docker-entrypoint.sh valkey-server /etc/valkey/valkey.conf --aclfile /run/valkey/users.acl
    secrets: [valkey_admin_password, valkey_litellm_password, valkey_app_password]
    tmpfs:
      - /run/valkey:size=1m,mode=0700           # ACL file with passwords lives in RAM only
    volumes:
      - ../config/valkey/valkey.conf:/etc/valkey/valkey.conf:ro
      - valkey-data:/data
    ports:
      - "127.0.0.1:6379:6379"                   # localhost only (Step 3 rule)
    healthcheck:
      # "NOAUTH" means alive and correctly refusing anonymous access, so no password needed here
      test: ["CMD-SHELL", "valkey-cli ping 2>&1 | grep -qE 'PONG|NOAUTH'"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    deploy:
      resources:
        limits: { memory: 768m, cpus: "1" }     # a bit above maxmemory for overhead

  keycloak-db:                                                # Keycloak's own private database (Step 16)
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24   # same pinned image as litellm-db
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD_FILE: /run/secrets/keycloak_db_password
    secrets: [keycloak_db_password]
    volumes:
      - keycloak-db-data:/var/lib/postgresql/data
    # no "ports:": only Keycloak needs it
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    deploy:
      resources:
        limits: { memory: 512m, cpus: "1" }

  keycloak:                                                   # identity provider: realm "rag", users, groups, tokens (Step 16)
    image: quay.io/keycloak/keycloak:26.8.0@sha256:27b3230fbabb8c9ff3c66c864cf09dcd8a41aca82e5100679d109ef0eeb05741   # pin by digest (Step 9 method)
    # Keycloak reads passwords from environment variables, and the realm file's ${...} placeholders are
    # filled from them too. A tiny wrapper reads the secret FILES and exports them inside the process only.
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        export KC_BOOTSTRAP_ADMIN_PASSWORD="$$(cat /run/secrets/keycloak_admin_password)"
        export KC_DB_PASSWORD="$$(cat /run/secrets/keycloak_db_password)"
        export KEYCLOAK_INGESTION_SECRET="$$(cat /run/secrets/keycloak_ingestion_secret)"
        export KEYCLOAK_PROVISIONER_SECRET="$$(cat /run/secrets/keycloak_provisioner_secret)"
        exec /opt/keycloak/bin/kc.sh start --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak   # no password here (KC_DB_PASSWORD); gitleaks:allow
      KC_DB_USERNAME: keycloak
      KC_HOSTNAME: http://localhost:8180              # the one public address; becomes the token issuer
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"         # containers may call it as http://keycloak:8080
      KC_HTTP_ENABLED: "true"                         # plain HTTP only because it's bound to 127.0.0.1
      KC_HEALTH_ENABLED: "true"                       # /health/* on management port 9000
      KC_METRICS_ENABLED: "true"                      # /metrics on port 9000, for Prometheus (Step 20)
      KC_CACHE: local                                 # single node; clustering comes with Kubernetes
      KC_LOG_CONSOLE_OUTPUT: json                     # structured logs, for Loki (Step 21)
      KC_TRACING_ENABLED: "true"                      # sign-ins and token requests as spans (Step 19)
      KC_TRACING_ENDPOINT: http://otel-collector:4317
      KC_BOOTSTRAP_ADMIN_USERNAME: temp-admin         # used only on the very first start
    secrets: [keycloak_admin_password, keycloak_db_password, keycloak_ingestion_secret,
              keycloak_provisioner_secret]
    volumes:
      - ../config/keycloak/realm-rag.json:/opt/keycloak/data/import/realm-rag.json:ro
    ports:
      - "127.0.0.1:8180:8080"                         # 9000 (health/metrics) is NOT published
    depends_on:
      keycloak-db: { condition: service_healthy }
    healthcheck:
      # the image has no curl; bash talks HTTP to the readiness endpoint directly
      test: ["CMD", "bash", "-c", "{ printf 'HEAD /health/ready HTTP/1.0\\r\\n\\r\\n' >&0; grep -q 'HTTP/1.0 200'; } 0<>/dev/tcp/localhost/9000"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    deploy:
      resources:
        limits: { memory: 1536m, cpus: "2" }

  opa:                                                        # policy decision point: rag-api asks, OPA decides (Step 18)
    image: openpolicyagent/opa:1.21.1-static@sha256:4675ab04ad1627f74741d2d9c5142698c79e18b7b09f192587d31d6dba20838e   # pin by digest (Step 9 method)
    command:
      - run
      - --server
      - --addr=0.0.0.0:8181
      - --authentication=token                # read "Authorization: Bearer ..." as the caller's identity
      - --authorization=basic                 # ...and let system.authz decide what that identity may do
      - --bundle
      - /policies
      - --ignore=*_test.rego                  # tests stay out of the running server
      - --watch                               # dev: reload when you save a policy file
      - --log-format=json
      - --set=decision_logs.console=true      # every decision to stdout, as JSON
      - --set=distributed_tracing.type=grpc   # Step 19: a span per decision, joined to the caller's trace
      - --set=distributed_tracing.address=otel-collector:4317
      - --set=distributed_tracing.service_name=opa
    environment:
      OPA_API_TOKEN: ${OPA_API_TOKEN}         # read by system.authz via opa.runtime()
    volumes:
      - ../../policies:/policies:ro           # policies come from Git, read-only
    ports:
      - "127.0.0.1:8181:8181"
    # No healthcheck: the -static image holds only the opa binary (no shell, no curl). rag-api
    # protects itself instead (503 when OPA doesn't answer); Prometheus watches /health from Step 20.
    user: "65532:65532"                       # OPA warns when run as root; it doesn't need it
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    deploy:
      resources:
        limits: { memory: 256m, cpus: "0.5" }

  otel-collector:                                             # one pipe for traces, metrics and logs (Step 19)
    image: otel/opentelemetry-collector-contrib:0.162.0@sha256:39923a8e431bd1f57be82411999d389fcfe40857492e4365456d97a4c1f74be6   # pin by digest (Step 9 method)
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ../config/otel-collector/config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "127.0.0.1:4317:4317"                 # OTLP gRPC: native macOS processes and scripts can send too
      - "127.0.0.1:4318:4318"                 # OTLP HTTP
      - "127.0.0.1:13133:13133"               # health check
    # No healthcheck: the image holds only the Collector (no shell). Check from the host instead:
    # curl -s localhost:13133/ returns status JSON. Senders never fail when the Collector is down;
    # their exporters drop data and retry.
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    deploy:
      resources:
        limits: { memory: 512m, cpus: "1" }   # memory_limiter works as a percentage of this

  rag-api:                                                    # the platform's first service: verifies every Keycloak token (Step 17)
    build:
      context: ../..                                          # repository root
      dockerfile: services/rag-api/Dockerfile
    image: rag-platform/rag-api:dev
    environment:
      RAG_API_OIDC_ISSUER: http://localhost:8180/realms/rag   # must match the token's "iss"
      RAG_API_OIDC_JWKS_URL: http://keycloak:8080/realms/rag/protocol/openid-connect/certs
      RAG_API_GATEWAY_URL: http://litellm:4000/v1
      RAG_API_DB_HOST: rag-db
      RAG_API_OPA_URL: http://opa:8181                        # the policy decision point (Step 18)
      OTEL_SERVICE_NAME: rag-api                              # telemetry (Step 19): standard OTEL_* variables only
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_RESOURCE_ATTRIBUTES: service.version=0.1.0
      OTEL_TRACES_SAMPLER: parentbased_traceidratio
      OTEL_TRACES_SAMPLER_ARG: "1.0"                          # keep every trace in dev; lower in production
    secrets:
      - rag_api_gateway_key                                   # -> /run/secrets/rag_api_gateway_key
      - rag_api_db_password                                   # -> /run/secrets/rag_api_db_password
      - rag_api_opa_token                                     # -> /run/secrets/rag_api_opa_token (Step 18)
    ports:
      - "127.0.0.1:8000:8000"
    # The guide sets read_only: true here. Compose refuses it together with secrets that come from
    # environment variables ("cannot create secret ... in read-only service: `file` is the sole
    # supported option"), and file-sourced secrets would mean plaintext on disk. So the root
    # filesystem stays technically writable, but the app still can't modify its own files: it runs as
    # uid 10001 and everything under /app belongs to root (checked in tests/test_rag_api.py).
    tmpfs: [/tmp]                                             # scratch space in RAM only
    cap_drop: [ALL]                                           # no special Linux privileges at all
    security_opt: ["no-new-privileges:true"]
    depends_on:
      keycloak: { condition: service_healthy }
      rag-db:   { condition: service_healthy }
      litellm:  { condition: service_healthy }
      opa:      { condition: service_started }        # Step 18: no healthcheck in the static image
      otel-collector: { condition: service_started }  # Step 19: no shell, so no healthcheck
    restart: unless-stopped
    deploy:
      resources:
        limits: { memory: 512m, cpus: "1" }

volumes:
  litellm-db-data:                                            # keys, teams, budgets and spend logs live here
  rag-db-data:                                                # documents, chunks and vectors (Step 11)
  qdrant-data:                                                # collections, points and HNSW graphs (Step 12): rebuildable from rag-db
  qdrant-snapshots:                                           # Qdrant snapshot files (Step 12)
  opensearch-data:                                            # OpenSearch indices (Step 13): rebuildable from rag-db
  object-store-data:                                          # original files and their versions (Step 14): NOT rebuildable, back it up
  valkey-data:                                                # Valkey RDB snapshots + AOF log (Step 15): cache is disposable, queued jobs are not
  keycloak-db-data:                                           # Keycloak's users, sessions, events and realm settings (Step 16): back it up

secrets:
  litellm_master_key:
    environment: LITELLM_MASTER_KEY             # supplied by `sops exec-env` when you run `just up`
  tei_api_key:
    environment: TEI_API_KEY
  litellm_salt_key:
    environment: LITELLM_SALT_KEY               # encrypts credentials LiteLLM stores in its DB: NEVER change it
  litellm_db_password:
    environment: LITELLM_DB_PASSWORD
  rag_db_superuser_password:
    environment: POSTGRES_PASSWORD              # the rag-db superuser (admin only, via docker compose exec)
  rag_db_migrator_password:
    environment: RAG_DB_MIGRATOR_PASSWORD       # rag_migrator: schema changes through dbmate
  rag_db_app_password:
    environment: RAG_DB_APP_PASSWORD            # rag_app: services read/write rows
  rag_db_readonly_password:
    environment: RAG_DB_READONLY_PASSWORD       # rag_readonly: evaluation and analytics
  qdrant_api_key:
    environment: QDRANT_API_KEY                 # admin: create/delete collections, write, mint tokens
  qdrant_read_only_api_key:
    environment: QDRANT_READ_ONLY_API_KEY       # read-only, for quick checks
  opensearch_admin_password:
    environment: OPENSEARCH_ADMIN_PASSWORD      # OpenSearch "admin" (Step 13): only for setup and cluster checks
  s3_admin_access_key:
    environment: S3_ADMIN_ACCESS_KEY            # object store "admin" (Step 14): bucket setup and admin tasks only
  s3_admin_secret_key:
    environment: S3_ADMIN_SECRET_KEY
  s3_ingest_access_key:
    environment: S3_INGEST_ACCESS_KEY           # rag-ingest: read/write rag-raw-docs and rag-tmp
  s3_ingest_secret_key:
    environment: S3_INGEST_SECRET_KEY
  s3_reader_access_key:
    environment: S3_READER_ACCESS_KEY           # rag-reader: read rag-raw-docs only
  s3_reader_secret_key:
    environment: S3_READER_SECRET_KEY
  valkey_admin_password:
    environment: VALKEY_ADMIN_PASSWORD          # Valkey "admin" (Step 15): all keys and commands, via `just kv-cli`
  valkey_litellm_password:
    environment: VALKEY_LITELLM_PASSWORD        # litellm: gateway response cache (all keys, no @dangerous)
  valkey_app_password:
    environment: VALKEY_APP_PASSWORD            # rag_app: rag:* keys only, no @dangerous / @admin
  keycloak_admin_password:
    environment: KEYCLOAK_ADMIN_PASSWORD        # temp-admin, first start only (Step 16): replace it with your own MFA admin
  keycloak_db_password:
    environment: KEYCLOAK_DB_PASSWORD           # keycloak-db
  keycloak_ingestion_secret:
    environment: KEYCLOAK_INGESTION_SECRET      # ingestion-worker client secret (client credentials)
  keycloak_provisioner_secret:
    environment: KEYCLOAK_PROVISIONER_SECRET    # rag-provisioner client secret: manages users only
  rag_api_gateway_key:
    environment: RAG_API_GATEWAY_KEY            # rag-api (Step 17): the Step 10 virtual key "rag-api-dev"
  rag_api_db_password:
    environment: RAG_DB_APP_PASSWORD            # rag-api (Step 17): the Step 11 rag_app role
  rag_api_opa_token:
    environment: OPA_API_TOKEN                  # rag-api (Step 18): asks OPA for decisions; OPA reads the same value
