# Hooks run automatically on: git commit (pre-commit), message check (commit-msg), git push (pre-push).
default_install_hook_types: [pre-commit, commit-msg, pre-push]
default_stages: [pre-commit]
fail_fast: false

repos:
  # ---- Generic file hygiene (pinned; update with `pre-commit autoupdate`) ----
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]  # Kubernetes manifests hold several objects (Step 29)
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict      # leftover <<<<<<< markers
      - id: check-case-conflict       # File.txt vs file.txt (breaks on Linux)
      - id: check-added-large-files   # block files bigger than 1 MB
        args: [--maxkb=1024]
        # Step 29: Argo CD's release manifest (~1.9 MB), vendored on purpose and pinned by SHA-256.
        # Step 37: likewise Argo Rollouts (~3 MB) and CloudNativePG (~1.3 MB), mostly their CRDs.
        exclude: ^deploy/(argocd|argo-rollouts)/install/upstream/install\.yaml$|^deploy/cnpg/install/upstream/cnpg\.yaml$
      - id: detect-private-key        # -----BEGIN ... PRIVATE KEY-----
      - id: no-commit-to-branch       # never commit directly on main
        args: [--branch, main]

  # ---- Secret scanning ----
  - repo: https://github.com/gitleaks/gitleaks
    rev: 2ca41cc1372d1e939a6a879f18cdc19fc1cac1ce  # frozen: v8.30.0
    hooks:
      - id: gitleaks

  # ---- Commit message format (Conventional Commits) ----
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: 3db014c16a9d31997ab8c07a4d61fcce936c8f0d  # frozen: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [feat, fix, docs, refactor, test, build, ci, chore, perf, revert, deploy]  # deploy: `just promote` (Step 29)

  # ---- Python tools: run through uv so versions come from uv.lock ----
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check (lint, auto-fix)
        entry: uv run ruff check --fix --force-exclude
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --force-exclude
        language: system
        types_or: [python, pyi]
      - id: mypy
        name: mypy (strict type check)
        entry: uv run mypy
        language: system
        types: [python]
        pass_filenames: false         # mypy checks the configured files as a whole
      - id: uv-lock
        name: uv.lock matches pyproject.toml
        entry: uv lock --locked
        language: system
        files: (^|/)(pyproject\.toml|uv\.lock)$
        pass_filenames: false
      - id: pytest
        name: pytest (before push)
        entry: uv run pytest -q
        language: system
        stages: [pre-push]
        pass_filenames: false
        always_run: true
      - id: secrets-encrypted
        name: files in secrets/ are SOPS-encrypted
        entry: scripts/check-sops-encrypted.sh
        language: system
        files: ^secrets/
      - id: prompts-lint
        name: prompt registry (format, rules, lock, labels)
        entry: uv run python scripts/prompts.py lint
        language: system
        files: ^prompts/
        pass_filenames: false
      - id: cards
        name: cards (rules, cross-checks, generated docs up to date)
        entry: bash -c 'uv run python scripts/cards.py lint && uv run python scripts/cards.py docs --check'
        language: system
        files: ^(cards/|prompts/|docs/cards/|infra/model-serving/models\.yaml|infra/config/litellm/)
        pass_filenames: false
      - id: prompts-check-main
        name: released prompts unchanged vs main (before push)
        entry: just prompts-check-main
        language: system
        files: ^prompts/
        pass_filenames: false
        stages: [pre-push]
